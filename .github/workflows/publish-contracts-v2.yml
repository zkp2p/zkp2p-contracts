name: Publish contracts-v2

run-name: Publish @zkp2p/contracts-v2@${{ inputs.release }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact stable SemVer or matching -rc.N version committed on canonical main
        required: true
        type: string
      recovery:
        description: Verify an already-published immutable version after a post-publish propagation failure
        required: true
        default: false
        type: boolean
      release_run_id:
        description: Original non-recovery publish run ID whose validated tarball was accepted by npm
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-contracts-v2
  cancel-in-progress: false

env:
  FOUNDRY_VERSION: v1.7.1
  PACKAGE_JSON: packages/contracts/package.json
  PACK_ARTIFACT: contracts-v2-release-candidate
  RELEASE_VERSION: ${{ inputs.release }}
  RELEASE_TAG: contracts-v2-v${{ inputs.release }}
  LATEST_BASELINE: 0.4.0
  RC_BASELINE: 0.4.0-rc.5
  NPM_CONFIG_PROVENANCE: "true"
  REQUIRE_PROVENANCE: "true"
  RECOVERY_MODE: ${{ inputs.recovery }}

jobs:
  policy:
    name: Resolve release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      environment: ${{ steps.resolve.outputs.environment }}
      guard_latest: ${{ steps.resolve.outputs.guard_latest }}
      guard_rc: ${{ steps.resolve.outputs.guard_rc }}
      verify_latest: ${{ steps.resolve.outputs.verify_latest }}
      verify_rc: ${{ steps.resolve.outputs.verify_rc }}
    steps:
      - name: Checkout policy source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Resolve version-derived channel
        id: resolve
        run: node scripts/npm-release.mjs resolve "$PACKAGE_JSON" "$RELEASE_VERSION"

  validate:
    name: Build, validate, and pack
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DIST_TAG: ${{ needs.policy.outputs.dist_tag }}
      RELEASE_ENVIRONMENT: ${{ needs.policy.outputs.environment }}
      EXPECTED_LATEST: ${{ needs.policy.outputs.guard_latest }}
      EXPECTED_RC: ${{ needs.policy.outputs.guard_rc }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout canonical release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Pin release tooling
        run: |
          npm install --global npm@11.9.0 corepack@0.34.0
          corepack enable
          test "$(npm --version)" = "11.9.0"

      - name: Guard canonical release source, version, and dist-tags
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          if [ "$RECOVERY_MODE" = "true" ]; then
            case "$RELEASE_RUN_ID" in
              ''|*[!0-9]*)
                echo "Recovery requires the numeric original publish run ID" >&2
                exit 1
                ;;
            esac
            node scripts/npm-release.mjs recover "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG"
          else
            test -z "$RELEASE_RUN_ID"
            node scripts/npm-release.mjs guard "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG"
          fi

      - name: Require autonomous publishing environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-environment.mjs "$RELEASE_ENVIRONMENT"

      - name: Install immutable dependencies
        run: yarn install --immutable

      - name: Prepare local environment
        run: cp .env.default .env

      - name: Compile contracts
        run: |
          set -a
          . ./.env.default
          set +a
          yarn compile

      - name: Build and test package
        run: |
          yarn pkg:build
          yarn pkg:test
          yarn workspace @zkp2p/contracts-v2 verify:release
          yarn test:release-policy

      - name: Pack exact publish candidate
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          cd packages/contracts
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-pack" > "$RUNNER_TEMP/npm-pack.json"
          cp "$RUNNER_TEMP/npm-pack.json" "$RUNNER_TEMP/npm-pack/pack.json"
          cd ../..
          node packages/contracts/scripts/verify-release.mjs --pack-json "$RUNNER_TEMP/npm-pack.json" --pack-dir "$RUNNER_TEMP/npm-pack"

      - name: Clean-install and import exact tarball
        run: |
          tarball=$(node scripts/npm-release.mjs pack-path "$RUNNER_TEMP/npm-pack/pack.json" "$RUNNER_TEMP/npm-pack")
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init --yes
          npm install "$tarball" --ignore-scripts --no-audit --no-fund
          node "$GITHUB_WORKSPACE/packages/contracts/scripts/smoke-installed.mjs" "$RELEASE_VERSION"

      - name: Preserve validated tarball for publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PACK_ARTIFACT }}
          path: ${{ runner.temp }}/npm-pack
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  foundry-tests:
    name: Complete Foundry suite
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DIST_TAG: ${{ needs.policy.outputs.dist_tag }}
      RELEASE_ENVIRONMENT: ${{ needs.policy.outputs.environment }}
      EXPECTED_LATEST: ${{ needs.policy.outputs.guard_latest }}
      EXPECTED_RC: ${{ needs.policy.outputs.guard_rc }}
    permissions:
      contents: read
    steps:
      - name: Checkout canonical release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Pin release tooling
        run: |
          npm install --global npm@11.9.0 corepack@0.34.0
          corepack enable
          test "$(npm --version)" = "11.9.0"

      - name: Guard canonical release source
        run: |
          if [ "$RECOVERY_MODE" = "true" ]; then
            node scripts/npm-release.mjs recover "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG"
          else
            node scripts/npm-release.mjs guard "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG"
          fi

      - name: Install immutable dependencies
        run: yarn install --immutable

      - name: Prepare local environment
        run: cp .env.default .env

      - name: Restore exact-source Foundry cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v5
        with:
          path: |
            out
            cache_forge
          key: ${{ runner.os }}-foundry-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'contracts/**/*.sol', 'test-foundry/**/*.sol', 'lib/forge-std/src/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-foundry-${{ env.FOUNDRY_VERSION }}-

      - name: Run complete Foundry suite
        run: yarn test

  publish:
    name: Publish with npm OIDC
    needs: [policy, validate, foundry-tests]
    if: inputs.recovery == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DIST_TAG: ${{ needs.policy.outputs.dist_tag }}
      RELEASE_ENVIRONMENT: ${{ needs.policy.outputs.environment }}
      EXPECTED_LATEST: ${{ needs.policy.outputs.guard_latest }}
      EXPECTED_RC: ${{ needs.policy.outputs.guard_rc }}
    environment:
      name: ${{ needs.policy.outputs.environment }}
      url: https://www.npmjs.com/package/@zkp2p/contracts-v2/v/${{ inputs.release }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release verification code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin OIDC-capable npm
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"

      - name: Download validated tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ env.PACK_ARTIFACT }}
          path: ${{ runner.temp }}/npm-pack

      - name: Verify downloaded tarball
        run: node packages/contracts/scripts/verify-release.mjs --pack-json "$RUNNER_TEMP/npm-pack/pack.json" --pack-dir "$RUNNER_TEMP/npm-pack"

      - name: Re-check canonical source, version, and dist-tags
        run: node scripts/npm-release.mjs guard "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG"

      - name: Publish exact tarball with provenance
        run: |
          tarball=$(node scripts/npm-release.mjs pack-path "$RUNNER_TEMP/npm-pack/pack.json" "$RUNNER_TEMP/npm-pack")
          npm publish "$tarball" --access public --tag "$DIST_TAG" --provenance

      - name: Verify registry version, dist-tag, integrity, and contents
        env:
          EXPECTED_LATEST: ${{ needs.policy.outputs.verify_latest }}
          EXPECTED_RC: ${{ needs.policy.outputs.verify_rc }}
        run: |
          node scripts/npm-release.mjs verify "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG" "$RUNNER_TEMP/npm-pack/pack.json"
          mkdir -p "$RUNNER_TEMP/registry-pack"
          for attempt in {1..12}; do
            if npm pack "@zkp2p/contracts-v2@$RELEASE_VERSION" --ignore-scripts --json --pack-destination "$RUNNER_TEMP/registry-pack" > "$RUNNER_TEMP/registry-pack.json"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 5
          done
          node packages/contracts/scripts/verify-release.mjs --pack-json "$RUNNER_TEMP/registry-pack.json" --pack-dir "$RUNNER_TEMP/registry-pack"
          for spec in "@zkp2p/contracts-v2@$RELEASE_VERSION" "@zkp2p/contracts-v2@$DIST_TAG"; do
            smoke_dir=$(mktemp -d "$RUNNER_TEMP/npm-registry-smoke.XXXXXX")
            cd "$smoke_dir"
            npm init --yes
            for attempt in {1..12}; do
              if npm install "$spec" --ignore-scripts --no-audit --no-fund; then
                break
              fi
              test "$attempt" -lt 12
              sleep 5
            done
            node "$GITHUB_WORKSPACE/packages/contracts/scripts/smoke-installed.mjs" "$RELEASE_VERSION"
          done

  recover:
    name: Verify published release recovery
    needs: [policy, validate, foundry-tests]
    if: inputs.recovery == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DIST_TAG: ${{ needs.policy.outputs.dist_tag }}
      RELEASE_ENVIRONMENT: ${{ needs.policy.outputs.environment }}
      EXPECTED_LATEST: ${{ needs.policy.outputs.guard_latest }}
      EXPECTED_RC: ${{ needs.policy.outputs.guard_rc }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release verification code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin release tooling
        run: |
          npm install --global npm@11.9.0
          test "$(npm --version)" = "11.9.0"

      - name: Re-check canonical recovery source
        run: node scripts/npm-release.mjs recover "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG"

      - name: Download original validated publish tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ env.PACK_ARTIFACT }}
          path: ${{ runner.temp }}/npm-pack
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Verify downloaded tarball
        run: node packages/contracts/scripts/verify-release.mjs --pack-json "$RUNNER_TEMP/npm-pack/pack.json" --pack-dir "$RUNNER_TEMP/npm-pack"

      - name: Verify registry version, dist-tag, integrity, and contents
        env:
          EXPECTED_LATEST: ${{ needs.policy.outputs.verify_latest }}
          EXPECTED_RC: ${{ needs.policy.outputs.verify_rc }}
        run: |
          node scripts/npm-release.mjs verify "$PACKAGE_JSON" "$RELEASE_VERSION" "$DIST_TAG" "$RUNNER_TEMP/npm-pack/pack.json"
          mkdir -p "$RUNNER_TEMP/registry-pack"
          npm pack "@zkp2p/contracts-v2@$RELEASE_VERSION" --ignore-scripts --json --pack-destination "$RUNNER_TEMP/registry-pack" > "$RUNNER_TEMP/registry-pack.json"
          node packages/contracts/scripts/verify-release.mjs --pack-json "$RUNNER_TEMP/registry-pack.json" --pack-dir "$RUNNER_TEMP/registry-pack"
          for spec in "@zkp2p/contracts-v2@$RELEASE_VERSION" "@zkp2p/contracts-v2@$DIST_TAG"; do
            smoke_dir=$(mktemp -d "$RUNNER_TEMP/npm-registry-smoke.XXXXXX")
            cd "$smoke_dir"
            npm init --yes
            npm install "$spec" --ignore-scripts --no-audit --no-fund
            node "$GITHUB_WORKSPACE/packages/contracts/scripts/smoke-installed.mjs" "$RELEASE_VERSION"
          done
