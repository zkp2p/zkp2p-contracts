name: Foundry CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.7.1
  NODE_VERSION: 20.20.2

jobs:
  test:
    name: Complete Foundry suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies reproducibly
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Prepare local environment
        run: cp .env.default .env
      - name: Verify pinned tools
        run: |
          forge --version
          node --version
          corepack yarn --version
      - name: Restore incremental Foundry build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            out
            cache_forge
          key: ${{ runner.os }}-foundry-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'contracts/**/*.sol', 'test-foundry/**/*.sol', 'lib/forge-std/src/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-foundry-${{ env.FOUNDRY_VERSION }}-
      - name: Run every deterministic, fuzz, invariant, integration, and deployment test
        run: corepack yarn test

  build-and-deploy:
    name: Build, package, and localhost deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies reproducibly
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Prepare local environment
        run: cp .env.default .env
      - name: Compile deployment contracts and package
        run: |
          corepack yarn compile
          corepack yarn pkg:build
          corepack yarn pkg:test
      - name: Start local chain
        run: |
          corepack yarn chain > /tmp/zkp2p-hardhat-node.log 2>&1 &
          for attempt in {1..60}; do
            if node -e "const socket=require('net').connect(8545,'127.0.0.1');socket.on('connect',()=>process.exit(0));socket.on('error',()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          tail -200 /tmp/zkp2p-hardhat-node.log
          exit 1
      - name: Deploy production scripts to localhost
        run: corepack yarn deploy:localhost

  coverage-producers:
    name: Coverage producer (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - deterministic
          - parity-main
          - parity-collisions
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies reproducibly
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Prepare local environment
        run: cp .env.default .env
      - name: Produce ${{ matrix.group }} coverage artifacts
        run: node foundry-migration/tools/run-foundry-coverage.cjs --group "${{ matrix.group }}"
      - name: Upload ${{ matrix.group }} coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.group }}
          path: coverage
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Foundry coverage and Codecov
    needs:
      - coverage-producers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download parallel coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Merge coverage and enforce same-denominator gates
        run: node foundry-migration/tools/run-foundry-coverage.cjs --merge-only
      - name: Upload Foundry LCOV to Codecov with OIDC
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: foundry
          disable_search: true
          fail_ci_if_error: true
