name: Hardhat Full Suite

on:
  push:
    branches:
      - main
      - codex/foundry-main
  pull_request:
    branches:
      - main
      - codex/foundry-main
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Specify node version...
        uses: actions/setup-node@v3
        with:
          node-version: '18.15.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install Dependencies
        run: yarn install
      - name: Set up env variables...
        run: cp .env.default .env
      - name: Set-up chain...
        run: yarn chain &
        env:
          PORT: 8545
      - name: Run tests
        run: yarn test
      - name: Build contracts package
        run: yarn pkg:build
      - name: Test contracts package
        run: yarn pkg:test
      - name: Stage active deployment scripts
        run: |
          mkdir -p deploy-ci
          find deploy -maxdepth 1 -type f ! -name '26_deploy_stake_risk_system.ts' -exec cp {} deploy-ci/ \;
      - name: Deploy to localhost
        run: yarn hardhat deploy --network localhost --deploy-scripts deploy-ci
      - name: Test deploy
        run: >-
          yarn hardhat test
          $(find test/deploy -maxdepth 1 -type f -name '*.ts' ! -name '26_stakeRiskSystem.spec.ts' -print | sort)
          --network localhost
