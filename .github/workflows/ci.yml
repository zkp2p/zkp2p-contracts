name: Foundry CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - "audits/**"
      - "deployment-logs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - "audits/**"
      - "deployment-logs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.7.1
  NODE_VERSION: 20.20.2

jobs:
  test:
    name: Complete Foundry suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install dependencies reproducibly
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Prepare local environment
        run: cp .env.default .env
      - name: Verify pinned tools
        run: |
          forge --version
          node --version
          corepack yarn --version
      - name: Restore incremental Foundry build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            out
            cache_forge
          key: ${{ runner.os }}-foundry-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'contracts/**/*.sol', 'test-foundry/**/*.sol', 'lib/forge-std/src/**/*.sol') }}
          restore-keys: |
            ${{ runner.os }}-foundry-${{ env.FOUNDRY_VERSION }}-
      - name: Run every deterministic, fuzz, invariant, integration, and deployment test
        run: corepack yarn test
