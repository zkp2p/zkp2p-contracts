name: Foundry Deploy Lane

on:
  push:
    branches:
      - main
      - codex/foundry-main
  pull_request:
    branches:
      - main
      - codex/foundry-main
  workflow_dispatch:

jobs:
  foundry-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18.15.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run Foundry deploy tests
        run: yarn test:forge:deploy
