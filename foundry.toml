[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test-foundry'
cache_path = 'cache_forge'
optimizer = true
optimizer_runs = 800
solc_version = '0.8.18'
via_ir = true
ffi = true

[profile.fork]
evm_version = 'cancun'

# Remappings for cleaner imports
remappings = [
    '@openzeppelin/=node_modules/@openzeppelin/',
    'contracts/=contracts/',
    'forge-std/=lib/forge-std/src/'
]

# Fuzzing configuration
[fuzz]
runs = 512
max_test_rejects = 65536

[invariant]
runs = 128
depth = 64
fail_on_revert = true
show_metrics = true
